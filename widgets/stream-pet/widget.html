<!-- Interactive On-Screen Stream Pet HTML -->
<div id="pet-widget-container">
  <div id="pet-wrapper">
    <!-- Animated dog character container -->
    <div id="pet-character-container">
      <!-- Glassmorphic action speech/status bubble -->
      <div id="speech-bubble" class="speech-bubble">
        <span id="speech-text">Woof!</span>
      </div>

      <!-- Sleeping particles (Zzz...) -->
      <div id="sleep-particles" class="sleep-particles"></div>

      <!-- Falling treat element for the !treat command -->
      <div id="falling-treat" class="falling-treat">🦴</div>

      <!-- Patting hand element for the !pet command -->
      <img id="pat-hand" class="pat-hand" src="https://cdn.jsdelivr.net/gh/thecozycapy/stream-pet-assets@main/hand.png" alt="Patting Hand">

      <div id="pet-character">
        <img id="pet-img" src="https://cdn.jsdelivr.net/gh/thecozycapy/stream-pet-assets@main/Dog%201.png" alt="Rusty">
      </div>
    </div>

    <!-- Custom pet bed image with dynamic name tag -->
    <div id="pet-bed">
      <img id="bed-img" src="https://cdn.jsdelivr.net/gh/thecozycapy/stream-pet-assets@main/Dog%20bed.png" alt="Dog Bed">
      <div id="bed-name-text"></div>
    </div>
  </div>
</div>
