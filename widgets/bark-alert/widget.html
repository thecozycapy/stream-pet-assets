<!-- Bark Alert Box HTML -->
<div id="alert-container" class="alert-hidden">
  <!-- Profile Picture in background -->
  <div class="pfp-container">
    <img id="alert-pfp" src="https://static-cdn.jtvnw.net/user-default-pictures-uv/cdd517ad-def8-437d-9a4e-c27c02511a3c-profile_image-70x70.png" alt="">
  </div>
  
  <!-- Dog Collar overlay -->
  <div class="collar-wrapper">
    <div class="collar-strap"></div>
    <div class="collar-pendant">🦴</div>
  </div>
  
  <!-- Dog Bone in foreground -->
  <div class="bone-container">
    <div class="bone-joint joint-top-left"></div>
    <div class="bone-joint joint-bottom-left"></div>
    <div class="bone-shaft">
      <span id="alert-message-text">Awaiting adoption...</span>
    </div>
    <div class="bone-joint joint-top-right"></div>
    <div class="bone-joint joint-bottom-right"></div>
  </div>
</div>
