<!-- Dog Bowl HTML -->
<div id="bowl-widget-container">
  <!-- Dynamic physics canvas overlay -->
  <canvas id="physics-canvas"></canvas>

  <!-- Foreground visual dog bowl image representation -->
  <div id="foreground-bowl-container">
    <img id="bowl-img" src="Dog bowl.png" alt="Dog Bowl" onerror="this.onerror=null; this.src='https://cdn.jsdelivr.net/gh/thecozycapy/stream-pet-assets@main/Dog%20bowl.png';">
    <div id="treat-count-display">
      <span id="treat-count-number">0</span>
      <span id="treat-count-label">TREATS</span>
    </div>
  </div>
</div>
