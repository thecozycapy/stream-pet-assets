<!-- Dog Bowl Treat Counter HTML -->
<div id="bowl-widget-container">
  <!-- Dynamic physics canvas overlay for falling treats -->
  <canvas id="physics-canvas"></canvas>

  <!-- Foreground custom Dog Bowl image representation -->
  <div id="foreground-bowl-container">
    <img id="bowl-img" src="https://cdn.jsdelivr.net/gh/thecozycapy/stream-pet-assets@main/Dog%20bowl.png" alt="Dog Bowl">
    <div id="treat-count-display">
      <span id="treat-count-number">0</span>
      <span id="treat-count-label">TREATS</span>
    </div>
  </div>
</div>
