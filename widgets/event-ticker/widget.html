<!-- Animated Event Ticker / Banner HTML -->
<div id="ticker-widget-container">
  <div id="ticker-banner">
    <!-- Walking Dog Runner (Animated walk in place) -->
    <div id="ticker-runner">
      <img id="ticker-dog-img" src="../../Dog.png" alt="Walking Dog">
    </div>

    <!-- Scrolling Text Container -->
    <div id="ticker-track">
      <div class="marquee-scroller" id="marquee-scroller">
        <!-- Inside here we will dynamically generate duplicate scroller elements for infinite looping -->
        <div class="scroller-inner" id="scroller-1">
          <!-- Dynamic contents injected by JS -->
        </div>
        <div class="scroller-inner" id="scroller-2">
          <!-- Duplicate contents injected by JS -->
        </div>
      </div>
    </div>
  </div>
</div>
