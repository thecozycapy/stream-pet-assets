<!-- Animated Event Ticker / Banner HTML -->
<div id="ticker-widget-container">
  <div id="ticker-banner">
    <!-- Walking Dog Runner (Animated walk cycle) -->
    <div id="ticker-runner">
      <div id="ticker-runner-bob">
        <img id="ticker-dog-img" src="widgets/event-ticker/Dog.png" alt="Walking Dog" onerror="this.onerror=null; this.src='https://cdn.jsdelivr.net/gh/thecozycapy/stream-pet-assets@main/Dog.png';">
      </div>
      <div id="ticker-runner-shadow"></div>
    </div>

    <!-- Scrolling Text Container -->
    <div id="ticker-track">
      <div class="marquee-scroller" id="marquee-scroller">
        <!-- Half A (Loop Segment 1 & 2) -->
        <div class="marquee-half" id="marquee-half-1">
          <div class="scroller-inner"></div>
          <div class="scroller-inner"></div>
        </div>
        <!-- Half B (Seamless Duplicate Segment 1 & 2) -->
        <div class="marquee-half" id="marquee-half-2">
          <div class="scroller-inner"></div>
          <div class="scroller-inner"></div>
        </div>
      </div>
    </div>
  </div>
</div>
